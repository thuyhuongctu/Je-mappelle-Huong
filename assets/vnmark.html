<!-- Mẫu hình chìm bản đồ Việt Nam.
     Dán khối này vào cuối <body> của một trang để có hình chìm ở góc phải dưới.
     Đường viền sinh từ Natural Earth 1:10m qua scripts/make-vn-outline.py, cùng
     một tệp assets/img/vn-outline.svg mà trang chủ và vườn số đang dùng, nên hình
     ở mọi trang không bao giờ lệch nhau. Màu lấy từ biến --accent nên tự theo cả
     chế độ sáng và tối. Trình duyệt không hỗ trợ mask thì khối không hiện - đây
     chỉ là trang trí, không mang thông tin.
     Nếu trang nằm trong thư mục con, sửa đường dẫn trong mask cho đúng. -->
<div class="vnmark" aria-hidden="true"><style>
.vnmark{display:none}
@supports ((mask-image:url(x)) or (-webkit-mask-image:url(x))){
  .vnmark{display:block;position:fixed;right:10px;bottom:10px;width:112px;height:126px;
    z-index:-1;pointer-events:none;background:var(--accent);opacity:.18;
    -webkit-mask:url('assets/img/vn-outline.svg') right bottom/contain no-repeat;
            mask:url('assets/img/vn-outline.svg') right bottom/contain no-repeat}
  @media(max-width:560px){.vnmark{width:84px;height:95px;opacity:.14}}
}
</style></div>
